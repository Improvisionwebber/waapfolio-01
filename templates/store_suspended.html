{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Temporarily Unavailable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#ffffff;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Inter,sans-serif;
        }

        .card-box{
            max-width:650px;
            width:100%;
            text-align:center;
            padding:60px 45px;
            border-radius:24px;
            background:#fff;
            box-shadow:0 20px 60px rgba(0,0,0,.08);
        }

        .icon{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#dcfce7;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:42px;
            margin:auto;
            margin-bottom:25px;
        }

        h1{
            font-weight:700;
            margin-bottom:15px;
        }

        p{
            color:#666;
            line-height:1.8;
            margin-bottom:30px;
        }

        .btn-success{
            padding:14px 30px;
            border-radius:12px;
            font-weight:600;
        }
    </style>

</head>

<body>

<div class="card-box">

    <div class="icon">
        🔒
    </div>

    <h1>Store Temporarily Unavailable</h1>

    <p>
        This store is currently unavailable because the owner's Premium subscription has expired.
        Once the subscription is renewed, the store will automatically become available again.
    </p>

    <a href="https://waapfolio.com" class="btn btn-success">
        Visit Waapfolio
    </a>

</div>

</body>
</html>
